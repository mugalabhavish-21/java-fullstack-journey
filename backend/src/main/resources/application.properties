spring.application.name=hireflow-api
server.port=${PORT:8080}

# H2 is convenient for local development. Production uses the managed PostgreSQL connection string.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:hireflow;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Isolate HireFlow tables when sharing an existing PostgreSQL instance.
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS hireflow
spring.jpa.properties.hibernate.default_schema=hireflow


# Operational health endpoints. Only health is exposed over HTTP.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Demo accounts are convenient locally but must be disabled for production.
app.demo-users.enabled=${APP_DEMO_USERS_ENABLED:true}
app.demo-jobs.enabled=${APP_DEMO_JOBS_ENABLED:true}
