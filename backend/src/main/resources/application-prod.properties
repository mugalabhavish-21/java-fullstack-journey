# Activate with SPRING_PROFILES_ACTIVE=prod.
# Supply DB_HOST, DB_PORT, DB_NAME, DB_USER, and DB_PASSWORD via Northflank secrets.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Isolate HireFlow tables within the managed PostgreSQL database.
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS hireflow
spring.jpa.properties.hibernate.default_schema=hireflow

# Conservative connection pool for a small hobby deployment.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
