# Production profile. DATABASE_URL is supplied by Render PostgreSQL and parsed by ProductionDataSourceConfig.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Keep HireFlow tables isolated within the managed PostgreSQL database.
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS hireflow
spring.jpa.properties.hibernate.default_schema=hireflow

# Conservative connection pool for a small deployment.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Never create public demo credentials in production.
app.demo-users.enabled=${APP_DEMO_USERS_ENABLED:false}
app.demo-jobs.enabled=${APP_DEMO_JOBS_ENABLED:false}

# Optional one-time bootstrap for a trusted recruiter. Remove both variables after account creation.
app.bootstrap-recruiter.email=${INITIAL_RECRUITER_EMAIL:}
app.bootstrap-recruiter.password=${INITIAL_RECRUITER_PASSWORD:}
