<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="converter-card">
        <div class="brand-row">
          <div class="brand-icon">€</div>
          <div>
            <p class="eyebrow">Global exchange</p>
            <h1>Currency Converter</h1>
          </div>
        </div>

        <div class="amount-box">
          <label for="amount">Amount</label>
          <div class="input-wrap">
            <span class="currency-symbol">$</span>
            <input id="amount" type="number" value="100" min="0" step="0.01" />
          </div>
        </div>

        <div class="converter-row">
          <div class="field-block">
            <label for="fromCurrency">From</label>
            <select id="fromCurrency">
              <option value="USD">USD - US Dollar</option>
              <option value="EUR">EUR - Euro</option>
              <option value="INR" selected>INR - Indian Rupee</option>
              <option value="GBP">GBP - British Pound</option>
              <option value="JPY">JPY - Japanese Yen</option>
              <option value="AUD">AUD - Australian Dollar</option>
              <option value="CAD">CAD - Canadian Dollar</option>
            </select>
          </div>

          <button id="swapBtn" class="swap-btn" type="button" aria-label="Swap currencies">⇅</button>

          <div class="field-block">
            <label for="toCurrency">To</label>
            <select id="toCurrency">
              <option value="USD" selected>USD - US Dollar</option>
              <option value="EUR">EUR - Euro</option>
              <option value="INR">INR - Indian Rupee</option>
              <option value="GBP">GBP - British Pound</option>
              <option value="JPY">JPY - Japanese Yen</option>
              <option value="AUD">AUD - Australian Dollar</option>
              <option value="CAD">CAD - Canadian Dollar</option>
            </select>
          </div>
        </div>

        <button id="convertBtn" class="convert-btn" type="button">Convert</button>

        <div class="result-panel">
          <p>Converted Amount</p>
          <div class="result-line">
            <span id="result">0.00</span>
            <span id="toCode">USD</span>
          </div>
          <small id="rateInfo">1 INR = 0.012 USD</small>
        </div>
      </div>
    </div>

    <script>
      const rates = {
        USD: 1,
        EUR: 0.92,
        INR: 83.45,
        GBP: 0.79,
        JPY: 157.32,
        AUD: 1.51,
        CAD: 1.36
      };

      const amountInput = document.getElementById('amount');
      const fromCurrency = document.getElementById('fromCurrency');
      const toCurrency = document.getElementById('toCurrency');
      const result = document.getElementById('result');
      const toCode = document.getElementById('toCode');
      const rateInfo = document.getElementById('rateInfo');
      const convertBtn = document.getElementById('convertBtn');
      const swapBtn = document.getElementById('swapBtn');

      function convertCurrency() {
        const amount = parseFloat(amountInput.value) || 0;
        const from = fromCurrency.value;
        const to = toCurrency.value;

        const usdValue = amount / rates[from];
        const converted = usdValue * rates[to];

        result.textContent = converted.toFixed(2);
        toCode.textContent = to;

        const oneUnit = (rates[to] / rates[from]).toFixed(4);
        rateInfo.textContent = `1 ${from} = ${oneUnit} ${to}`;
      }

      convertBtn.addEventListener('click', convertCurrency);
      amountInput.addEventListener('input', convertCurrency);
      fromCurrency.addEventListener('change', convertCurrency);
      toCurrency.addEventListener('change', convertCurrency);

      swapBtn.addEventListener('click', () => {
        const temp = fromCurrency.value;
        fromCurrency.value = toCurrency.value;
        toCurrency.value = temp;
        convertCurrency();
      });

      convertCurrency();
    </script>
  </body>
</html>
