name: HireFlow CI

on:
  push:
    branches: [main, hireflow-complete, production/hireflow-readiness]
    paths:
      - 'backend/**'
      - 'hireflow-frontend/**'
      - 'render.yaml'
      - '.github/workflows/hireflow-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'hireflow-frontend/**'
      - 'render.yaml'
      - '.github/workflows/hireflow-ci.yml'

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: hireflow-frontend
        run: npm install
      - name: Build
        working-directory: hireflow-frontend
        run: npm run build

  backend:
    name: Spring Boot tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.5.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml test
