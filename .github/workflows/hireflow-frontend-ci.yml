name: HireFlow frontend CI

on:
  push:
    branches: [main, production/hireflow-auth-ui]
    paths:
      - 'hireflow-frontend/**'
      - '.github/workflows/hireflow-frontend-ci.yml'
  pull_request:
    paths:
      - 'hireflow-frontend/**'
      - '.github/workflows/hireflow-frontend-ci.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build authenticated frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: hireflow-frontend
        run: npm install
      - name: Build
        working-directory: hireflow-frontend
        run: npm run build
