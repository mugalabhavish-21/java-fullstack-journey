<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HireFlow — React Interview Project</title><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script></head><body><div id="root"></div><script type="text/babel">const jobs=[{id:1,t:'React Frontend Developer',c:'Nova Labs',l:'Hyderabad',y:'Full Time',s:'₹4.5–6 LPA',k:['React','JavaScript','REST API']},{id:2,t:'Full Stack Developer',c:'Helical IT Solutions',l:'Hyderabad',y:'Full Time',s:'₹3.5 LPA',k:['HTML','CSS','React','Node.js']},{id:3,t:'Java Developer Intern',c:'CodeCraft Systems',l:'Bengaluru',y:'Internship',s:'₹20k / month',k:['Java','Spring Boot','SQL']},{id:4,t:'UI Engineer',c:'PixelWorks',l:'Pune',y:'Full Time',s:'₹5–7 LPA',k:['React','CSS','Figma']},{id:5,t:'Frontend Engineer',c:'CloudNest',l:'Remote',y:'Full Time',s:'₹6–9 LPA',k:['React','TypeScript','Testing']},{id:6,t:'Web Developer Intern',c:'BrightByte',l:'Hyderabad',y:'Internship',s:'₹15k / month',k:['HTML','CSS','JavaScript']}];function App(){const[q,setQ]=React.useState(''),[type,setType]=React.useState('All'),[saved,setSaved]=React.useState([]),[sel,setSel]=React.useState(null);let f=jobs.filter(j=>(!q||(`${j.t} ${j.c} ${j.k}`.toLowerCase().includes(q.toLowerCase())))&&(type==='All'||j.y===type));return <div style={{fontFamily:'system-ui',maxWidth:1100,margin:'auto',padding:24,color:'#18202a'}}><header style={{display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:'1px solid #ddd',paddingBottom:18}}><h2>HireFlow <small style={{color:'#635bff'}}>React Project</small></h2><span>Bhavish Mugala</span></header><section style={{padding:'55px 0 30px'}}><p style={{color:'#635bff',fontWeight:700}}>REACT + VITE PORTFOLIO PROJECT</p><h1 style={{fontSize:56,margin:'10px 0'}}>Find your next <span style={{color:'#635bff'}}>opportunity.</span></h1><p style={{color:'#687386'}}>Responsive job board demonstrating React hooks, filtering, state management and local persistence.</p></section><div style={{display:'flex',gap:10,marginBottom:35}}><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search jobs, skills or companies..." style={{flex:1,padding:15,border:'1px solid #ddd',borderRadius:10}}/><select value={type} onChange={e=>setType(e.target.value)} style={{padding:15,border:'1px solid #ddd',borderRadius:10}}><option>All</option><option>Full Time</option><option>Internship</option></select></div><h2>{f.length} positions found</h2><div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16}}>{f.map(j=><article key={j.id} style={{border:'1px solid #e5e9f0',borderRadius:16,padding:20}}><button onClick={()=>setSaved(s=>s.includes(j.id)?s.filter(x=>x!==j.id):[...s,j.id])} style={{float:'right',border:0,background:'none',fontSize:22,color:'#635bff'}}>{saved.includes(j.id)?'★':'☆'}</button><p style={{color:'#687386'}}>{j.c}</p><h3>{j.t}</h3><p style={{fontSize:12,color:'#687386'}}>⌖ {j.l} · ▣ {j.y}</p><div>{j.k.map(x=><span key={x} style={{display:'inline-block',padding:'5px 8px',background:'#f0efff',borderRadius:6,fontSize:10,margin:'3px'}}>{x}</span>)}</div><hr style={{border:0,borderTop:'1px solid #eee',margin:'18px 0'}}/><b>{j.s}</b><button onClick={()=>setSel(j)} style={{float:'right',border:0,background:'none',color:'#635bff',fontWeight:700}}>View details →</button></article>)}</div>{sel&&<div onClick={()=>setSel(null)} style={{position:'fixed',inset:0,background:'#0008',display:'grid',placeItems:'center',padding:20}}><div onClick={e=>e.stopPropagation()} style={{background:'#fff',padding:30,borderRadius:18,maxWidth:500,width:'100%'}}><button onClick={()=>setSel(null)} style={{float:'right',border:0,background:'none',fontSize:24}}>×</button><p style={{color:'#687386'}}>{sel.c}</p><h2>{sel.t}</h2><p>Location: {sel.l} · {sel.y}</p><p>This interactive details view is powered by React state and event handling.</p><button style={{width:'100%',padding:14,border:0,borderRadius:9,background:'#635bff',color:'#fff',fontWeight:700}} onClick={()=>setSel(null)}>Apply now →</button></div></div>}</div>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
