# Render Blueprint for HireFlow
# Deploy this Blueprint from the hireflow-complete branch.
# Free Render Postgres expires after 30 days; see README for limitations.
services:
  - type: web
    name: hireflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: DATABASE_URL
        fromDatabase:
          name: hireflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: hireflow-db
    databaseName: hireflow
    user: hireflow
    plan: free
    postgresMajorVersion: "18"
